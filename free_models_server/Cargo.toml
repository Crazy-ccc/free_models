[package]
name = "free_models_server"
version = "0.1.0"
edition = "2021"

[dependencies]
actix-web = "4"
sea-orm = { version = "2", features = ["sqlx-mysql", "runtime-tokio-rustls", "macros"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls"] }
dotenv = "0.15"
futures-util = "0.3"
chrono = { version = "0.4", features = ["serde"] }
log = "0.4"
env_logger = "0.11"
tokio = { version = "1", features = ["signal", "macros"] }
ed25519-dalek = "3"
sha2 = "0.11"
base64 = "0.22"
redis = { version = "1", features = ["tokio-comp", "connection-manager"] }
rand = "0.10"
tiktoken-rs = "0.12.0"
aes-gcm = "0.10"
hex = "0.4"